services:
  # ======================================================
  # ALEENA AI BACKEND
  # ======================================================

  - type: web
    name: aleena-ai-backend
    env: node

    region: oregon
    plan: free

    branch: main

    buildCommand: npm install && npm run migrate
    startCommand: npm start

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: aleena-ai-db
          property: connectionString

      - key: JWT_SECRET
        generateValue: true

      - key: FRONTEND_URL
        value: https://aleena-ai-web.onrender.com

      - key: GEMINI_API_KEY
        sync: false

      - key: GEMINI_MODEL
        value: gemini-3.8-flash

  # ======================================================
  # ALEENA AI FRONTEND
  # ======================================================

  - type: static
    name: aleena-ai-web

    env: static

    region: oregon

    rootDir: web

    buildCommand: npm install && npm run build

    publishDir: out

    routes:
      - type: rewrite
        source: /*
        destination: /index.html

    envVars:
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: aleena-ai-backend
          property: url

      - key: NEXT_PUBLIC_WS_URL
        value: wss://aleena-ai-backend.onrender.com/ws

# ========================================================
# POSTGRESQL DATABASE
# ========================================================

databases:
  - name: aleena-ai-db

    databaseName: aleena_ai_db

    user: aleena_user

    plan: free
